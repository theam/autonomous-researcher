services:
  limina:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    environment:
      LIMINA_API_TOKEN: ${LIMINA_API_TOKEN:-}
      LIMINA_OIDC_ISSUER: ${LIMINA_OIDC_ISSUER:-}
      LIMINA_OIDC_AUDIENCE: ${LIMINA_OIDC_AUDIENCE:-}
      LIMINA_OIDC_JWKS_URL: ${LIMINA_OIDC_JWKS_URL:-}
      LIMINA_OIDC_ALGORITHMS: ${LIMINA_OIDC_ALGORITHMS:-RS256}
      LIMINA_OIDC_ADMIN_CLAIM: ${LIMINA_OIDC_ADMIN_CLAIM:-}
      LIMINA_OIDC_ADMIN_VALUE: ${LIMINA_OIDC_ADMIN_VALUE:-admin}
      LIMINA_OIDC_LEEWAY_SECONDS: ${LIMINA_OIDC_LEEWAY_SECONDS:-30}
      LIMINA_CORS_ORIGINS: ${LIMINA_CORS_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LIMINA_CODEX_MODEL: ${LIMINA_CODEX_MODEL:-gpt-5.4}
      LIMINA_CODEX_SANDBOX: ${LIMINA_CODEX_SANDBOX:-workspace-write}
      LIMINA_CLAUDE_MODEL: ${LIMINA_CLAUDE_MODEL:-}
      LIMINA_MCP_ALLOWED_HOSTS: ${LIMINA_MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*}
      LIMINA_MCP_ALLOWED_ORIGINS: ${LIMINA_MCP_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*,http://[::1]:*}
      LIMINA_UPLOAD_LIMIT_BYTES: ${LIMINA_UPLOAD_LIMIT_BYTES:-26214400}
    ports:
      - "${LIMINA_PORT:-7433}:7433"
    volumes:
      - limina-data:/var/lib/limina
    restart: unless-stopped

volumes:
  limina-data:

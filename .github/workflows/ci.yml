name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: LIMINA_TELEMETRY_INTERNAL=1 python -m unittest discover -s tests
      - name: Validate KB
        run: LIMINA_TELEMETRY_INTERNAL=1 python scripts/kb_validate.py

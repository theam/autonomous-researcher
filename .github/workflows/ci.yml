name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked Python dependencies
        run: uv sync --locked --all-extras --dev
      - name: Lint runtime
        run: uv run ruff format --check src migrations tests/test_cloud_*.py && uv run ruff check src migrations tests/test_cloud_*.py
      - name: Run tests
        run: LIMINA_TELEMETRY_INTERNAL=1 uv run python -m unittest discover -s tests
      - name: Validate KB
        run: LIMINA_TELEMETRY_INTERNAL=1 uv run python scripts/kb_validate.py

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: limina
      POSTGRES_USER: limina
      POSTGRES_PASSWORD: limina-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limina -d limina"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - limina-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    command: ["limina", "db", "upgrade"]
    environment:
      LIMINA_DATABASE_URL: postgresql+psycopg://limina:limina-local@postgres/limina
    depends_on:
      postgres:
        condition: service_healthy

  runtime:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    environment:
      LIMINA_DATABASE_URL: postgresql+psycopg://limina:limina-local@postgres/limina
      LIMINA_API_TOKEN: ${LIMINA_API_TOKEN:?Set LIMINA_API_TOKEN}
      LIMINA_CODEX_MODEL: ${LIMINA_CODEX_MODEL:-gpt-5.4}
      LIMINA_CODEX_SANDBOX: ${LIMINA_CODEX_SANDBOX:-workspace-write}
      LIMINA_SECRET_KEY: ${LIMINA_SECRET_KEY:-}
      LIMINA_SECRET_KEY_PATH: /var/lib/limina/secret.key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "7433:7433"
    volumes:
      - limina-data:/var/lib/limina
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  limina-postgres:
  limina-data:
